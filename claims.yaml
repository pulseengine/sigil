# claims.yaml — load-bearing public claims, bound to re-derivable evidence.
# Gated by verification/claim-check/claim-check.py in CI (.github/workflows/claim-check.yml).
# See the `claim-verification` skill: mark -> bind -> gate. Truth-over-time is a
# property of THIS GATE, not of whoever last edited the docs.
#
# Add a claim here whenever a doc asserts what the system *is / does / proves*
# (verification status, capability, compliance level, a trusted-base count).
# Bind it to a predicate a machine re-derives from source — never a number typed
# in prose.

claims:
  # --- SLSA compliance (issue #216 / REQ-20 sibling REQ-21) ----------------
  # Ground truth: SLSA v1.0's Build track defines Build L0-L3 ONLY. "Level 4"
  # existed in the superseded v0.1 draft and was dropped in v1.0. Claiming
  # "SLSA Level 4 ACHIEVED" against v1.0 asserts a level the spec does not define.

  - id: SLSA-NO-PHANTOM-L4
    doc: README.md                     # anchor doc (must exist); the gate is the glob below
    evidence:
      # The phantom claim must stay absent across ALL public surfaces. `count-max: 0`
      # greens at zero matches and goes RED the instant "SLSA Level 4"/"SLSA L4"/
      # "SLSA-L4" reappears. The mandatory `SLSA` adjacency is deliberate: it does
      # NOT match STPA loss identifiers ("L4"/"L5" with no SLSA prefix) in
      # docs/security/stpa-*.md, which are a different concept entirely.
      - kind: count-max
        pattern: 'SLSA[ -](Level ?4|L4)'
        glob: ['README.md', 'docs/**/*.md', 'examples/**/*.md', 'src/**/*.rs']
        max: 0

  - id: SLSA-BADGE-HONEST
    doc: README.md
    # The README SLSA badge must state the level v1.0 defines and we meet (Build L3),
    # not the phantom L4. The badge IS the evidence — relabel it, don't fake it.
    evidence:
      - kind: verbatim
        text: 'SLSA-Build_L3'

  - id: SLSA-L3-DISCLAIMER-PRESENT
    doc: docs/slsa-compliance.md
    # The honest scoping sentence must not be quietly deleted. count-min is the
    # presence dual of count-max (which would green a 0-match). Regex '.' spans the
    # en-dash in "L0-L3" so the encoding can't drift the check.
    evidence:
      - kind: count-min
        pattern: 'SLSA v1\.0 defines Build L0.L3 only'
        glob: ['docs/slsa-compliance.md']
        min: 1

  - id: SLSA-L3-EVIDENCE
    doc: docs/slsa-compliance.md
    # The Build-L3 claim rests on real artifacts: build-platform provenance emitted
    # by the release workflow, and material-pinning reproducibility tracking.
    evidence:
      - kind: file-exists
        path: .github/workflows/release.yml
      - kind: file-exists
        path: src/attestation/src/reproducibility.rs

  # --- The compliance action and the rivet binary it installs (#284) --------
  - id: RIVET-ACTION-PIN-AGREES
    doc: .github/workflows/release.yml
    # release.yml failed 8 times from 2026-09-08 because dependabot advanced the
    # compliance ACTION (0.32 -> 0.35 on 2026-09-01, then 0.37, 0.39, 0.40) while
    # `rivet-version:` — the rivet BINARY that action downloads — stayed frozen at
    # v0.3.0, which cannot parse this repo's schemas (dev@0.4.0, on-disk stpa-sec,
    # external-anchor). Dependabot only ever rewrites the `uses:` line, so the two
    # drift apart by construction: PR #312 does it again, in the open, today.
    #
    # The input cannot simply be dropped. Its default is "source", which runs
    # `cargo build --release -p rivet-cli` in the CALLER's workspace — correct
    # inside rivet, fatal here, since sigil has no rivet-cli crate. So the copies
    # have to agree, and keeping them equal is now a machine's job: a reviewer
    # held this invariant for eight failed releases.
    evidence:
      - kind: captures-agree
        patterns:
          - 'rivet/\.github/actions/compliance@(v[0-9]+\.[0-9]+\.[0-9]+)'
          - 'rivet-version:\s*(v[0-9]+\.[0-9]+\.[0-9]+)'
        glob: ['.github/workflows/*.yml']
        # 2 callers x 2 copies. A floor, not an equality: a third caller is fine,
        # a deleted pin is not.
        min-captures: 4

  # --- Kani masking may shrink, never grow (#145, audit C-7) ---------------
  - id: KANI-MASK-RATCHET
    doc: .github/workflows/formal-verification.yml
    # Four of the five Kani modules run with `tolerate_failure: true`, so the
    # job reports success over a non-zero `cargo kani` exit. Measured on main
    # @74665d9b: merkle 3 failed of 5, format 2 of 4, dsse 1 of 1, wasm_module
    # 1 of 1 — seven failing harnesses behind a green board. Each mask carries
    # an honest diagnosis at its matrix include site, and unmasking them is
    # tracked in #145.
    #
    # What this claim gates is the DIRECTION. A mask is a standing obligation;
    # adding a fifth one must be a deliberate, visible act rather than a line
    # in a diff nobody reads. count-max is a ratchet: it greens at 4 or fewer
    # and goes red at 5. Lower the number when a module is unmasked — that is
    # the only edit this claim invites.
    evidence:
      - kind: count-max
        pattern: 'tolerate_failure:\s*true'
        glob: ['.github/workflows/formal-verification.yml']
        max: 4
      # The unmasked module must stay unmasked. count-max would green a zero,
      # so presence needs its dual: if `varint` ever loses its
      # `tolerate_failure: false`, no Kani module is a gate at all.
      - kind: count-min
        pattern: 'tolerate_failure:\s*false'
        glob: ['.github/workflows/formal-verification.yml']
        min: 1
