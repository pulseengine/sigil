name: Set up gh (pinned, checksum-verified)
description: >
  Puts a GitHub CLI on PATH for jobs on self-hosted runners that do not ship
  one (the `light` boxes). Adapted from pulseengine/relay's setup-gh. A
  missing tool must fail loudly, and the tool must be the one we pinned.

# gh 2.100.0, same pin and SHA-256 as relay (checked there against the
# release's gh_2.100.0_checksums.txt). Bumping: change both values together,
# from the release's checksums file.
#
# The tarball is cached in the persistent tool cache, but it is re-verified
# against the pinned SHA-256 on every job and extracted fresh into
# $RUNNER_TEMP, so a cached file altered by another job on the same runner
# fails here instead of being run.
runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash
      env:
        GH_VERSION: '2.100.0'
        GH_SHA256: 'e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be'
      run: |
        set -euo pipefail
        cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/gh-dl"
        tgz="$cache/gh_${GH_VERSION}_linux_amd64.tar.gz"
        mkdir -p "$cache"
        if ! echo "${GH_SHA256}  ${tgz}" | sha256sum -c --status - 2>/dev/null; then
          rm -f "$tgz"
          curl -sSfL --retry 3 -o "$tgz.part" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          mv "$tgz.part" "$tgz"
        fi
        echo "${GH_SHA256}  ${tgz}" | sha256sum -c -
        dir="$RUNNER_TEMP/gh-$GH_VERSION"
        rm -rf "$dir" && mkdir -p "$dir"
        tar xzf "$tgz" -C "$dir" --strip-components=1
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/gh" --version | head -1
