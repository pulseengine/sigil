name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # The merge queue: run on the merge-group commit too, so the queue tests
  # the merged result. merge_group takes no paths filter: it always runs.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/**'
      # The `cargo` job's "Build Examples"/"Test Wasmtime Example" steps build
      # examples/wasmtime-loader, so changes there must trigger this workflow.
      # Without this, a breaking example-only change (e.g. a dependabot bump
      # past the pinned toolchain's MSRV) merges unvalidated and then fails the
      # next unrelated src/** push — which is how main went red (#285).
      - 'examples/**'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - '.bazelrc'
      - '.bazelversion'
      - 'wit/**'
      - '.github/workflows/rust.yml'
      - 'scripts/run-wsc-cli-wasm.sh'
      - 'scripts/wasip2-sign-roundtrip.sh'
      # The `Vacuous-oracle gate` job below RUNS
      # verification/vacuous-oracle-check/check.py, so a change to the gate's
      # own source must trigger the gate. It did not: this workflow's filters
      # listed every input except the checker itself, so an edit to check.py
      # landed with the job that runs it never re-running. Same shape as #285
      # (examples/** missing here) and #286 (Mythos paths left behind by the
      # crate split) — a gate scoped to everything but itself.
      - 'verification/**'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - '.bazelrc'
      - '.bazelversion'
      - 'wit/**'
      - '.github/workflows/rust.yml'
      - 'scripts/run-wsc-cli-wasm.sh'
      - 'scripts/wasip2-sign-roundtrip.sh'
      # The `Vacuous-oracle gate` job below RUNS
      # verification/vacuous-oracle-check/check.py, so a change to the gate's
      # own source must trigger the gate. It did not: this workflow's filters
      # listed every input except the checker itself, so an edit to check.py
      # landed with the job that runs it never re-running. Same shape as #285
      # (examples/** missing here) and #286 (Mythos paths left behind by the
      # crate split) — a gate scoped to everything but itself.
      - 'verification/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # REQ-30 / #258: fail CI when a test/proof selector matches zero targets or
  # when coverage silently omits a lib-bearing crate — i.e. when a "passing"
  # job is vacuous. Pure stdlib Python, so it needs no toolchain.
  vacuous-oracle-gate:
    name: Vacuous-oracle gate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for vacuous test/proof selectors and coverage omissions
      run: python3 verification/vacuous-oracle-check/check.py

  build-matrix:
    name: ${{ matrix.build-system }} on ${{ matrix.os }}
    # Stays on ubuntu-24.04: matrix includes macos-latest and bazel build-system uses cachix/install-nix-action; smithy is Linux-only and doesn't ship Nix or Bazel.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build-system: [cargo, bazel]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Cargo build and test
    - name: Cargo Build
      if: matrix.build-system == 'cargo'
      run: cargo build --locked --verbose

    - name: Cargo Test
      if: matrix.build-system == 'cargo'
      run: cargo test --locked --verbose

    # release.yml fails if `wsc sign` cannot parse wsc-cli.wasm, a wasip2
    # component (#164). A toolchain bump can change the component layout, so
    # check sign + verify (and a tampered-byte negative control) on a wasip2
    # component built by the pinned toolchain here, before a release finds out.
    - name: wsc signs a wasip2 component from the pinned toolchain
      if: matrix.build-system == 'cargo'
      run: scripts/wasip2-sign-roundtrip.sh target/debug/wsc

    # wasmtime is an optional dependency of wsc, enabled only by the `runtime`
    # feature, and nothing above builds that feature. So a wasmtime bump was
    # never compiled by CI: dependabot's wasmtime 50 PR (#348) showed 26 green
    # checks while `cargo check -p wsc --features runtime` fails on the pinned
    # toolchain (wasmtime 50 requires rustc 1.97). This step makes the
    # feature, and therefore every wasmtime bump, actually compile and test.
    - name: Cargo Test (runtime feature — compiles wasmtime)
      if: matrix.build-system == 'cargo'
      run: cargo test -p wsc --features runtime --locked runtime

    - name: Build Examples
      if: matrix.build-system == 'cargo'
      run: |
        echo "Building Wasmtime integration example"
        cd examples/wasmtime-loader
        cargo build --locked --release --verbose

    - name: Test Wasmtime Example
      if: matrix.build-system == 'cargo'
      run: |
        echo "Testing Wasmtime integration example"
        cd examples/wasmtime-loader

        # Test: Verify binary runs and shows help
        cargo run --locked --release -- --help

    # Bazel setup and builds
    - name: Install Nix
      if: matrix.build-system == 'bazel'
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Bazel
      if: matrix.build-system == 'bazel'
      uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      with:
        bazelisk-cache: true
        disk-cache: ${{ runner.os }}-bazel
        repository-cache: true

    - name: Build Core Library (Bazel)
      if: matrix.build-system == 'bazel'
      run: bazel build //src/lib:wsc

    - name: Build Signing Component (Bazel)
      if: matrix.build-system == 'bazel'
      run: bazel build //src/component:signing_lib

    - name: Build CLI Component (Bazel)
      if: matrix.build-system == 'bazel'
      run: bazel build //src/cli:wasmsign_cli

    # .bazelrc sets --lockfile_mode=error, so the three builds above passed
    # against MODULE.bazel.lock as committed. Planted control: change
    # Cargo.lock without regenerating MODULE.bazel.lock (the drift a
    # dependency PR produces) and require Bazel to refuse it.
    - name: Stale MODULE.bazel.lock is refused (planted control)
      if: matrix.build-system == 'bazel'
      run: |
        echo >> Cargo.lock
        if out="$(bazel build --nobuild //src/lib:wsc 2>&1)"; then
          git checkout -- Cargo.lock
          echo "::error::Bazel accepted a MODULE.bazel.lock that no longer matches Cargo.lock: --lockfile_mode=error is not in effect"
          exit 1
        fi
        git checkout -- Cargo.lock
        grep -q 'MODULE.bazel.lock is no longer up-to-date' <<<"$out" || {
          echo "::error::Bazel failed with Cargo.lock changed, but not on the stale lockfile"
          printf '%s\n' "$out" | tail -10
          exit 1
        }
        echo "ok  Bazel refuses a stale MODULE.bazel.lock"

    # Run what we build. release.yml signs and ships wsc-cli.wasm but nothing
    # ran it, so a component that fails to instantiate would ship. Build it with
    # release.yml's exact command, then run keygen, sign, verify, a cross-check
    # with the native wsc and a tampered-byte negative control inside it.
    - name: Build wsc-cli.wasm as release.yml does (Bazel, wasm32-wasip2)
      if: matrix.build-system == 'bazel' && matrix.os == 'ubuntu-24.04'
      run: |
        # bazel-bin follows the last configuration, so keep the native binary
        # before building for wasm32-wasip2.
        bazel build //src/cli:wasmsign_cli
        cp bazel-bin/src/cli/wasmsign_cli "$RUNNER_TEMP/wsc-native"
        bazel build //src/cli:wasmsign_cli_wasm --platforms=@rules_wasm_component//platforms:wasm32-wasip2
        cp bazel-bin/src/cli/wasmsign_cli.wasm "$RUNNER_TEMP/wsc-cli.wasm"

    - name: Install wasmtime
      if: matrix.build-system == 'bazel' && matrix.os == 'ubuntu-24.04'
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: wasmtime@50.0.1

    - name: wsc-cli.wasm runs under wasmtime (keygen, sign, verify, tamper control)
      if: matrix.build-system == 'bazel' && matrix.os == 'ubuntu-24.04'
      run: scripts/run-wsc-cli-wasm.sh wasmtime "$RUNNER_TEMP/wsc-cli.wasm" "$RUNNER_TEMP/wsc-native"

    # Advisory until kiln runs it: kiln 0.9.0 stops on the fused CLI with E6590
    # (kiln#745; see also kiln#480). The step never fails the job. It reports
    # the outcome as an annotation either way, so a pass is visible and the
    # step can then become blocking. Tarball digests are pinned from each
    # release's SHA256SUMS.txt, which was cosign-verified against that repo's
    # release workflow identity.
    - name: wsc-cli.wasm under kiln (advisory, kiln#745)
      if: matrix.build-system == 'bazel' && matrix.os == 'ubuntu-24.04'
      run: |
        d="$RUNNER_TEMP/kiln-meld"
        mkdir -p "$d"
        curl -fsSL -o "$d/kiln.tar.gz" \
          https://github.com/pulseengine/kiln/releases/download/v0.9.0/kiln-v0.9.0-x86_64-unknown-linux-gnu.tar.gz
        curl -fsSL -o "$d/meld.tar.gz" \
          https://github.com/pulseengine/meld/releases/download/v0.69.0/meld-v0.69.0-x86_64-unknown-linux-gnu.tar.gz
        printf '%s  %s\n' \
          6a1e334ba319fbaaca5858d333088c0d82a13b789e7479b5af119028b5f32aaf "$d/kiln.tar.gz" \
          cef5a7fdeb497b3415baa454a2d064c2083aa3a532a2b40fbfe6a7543786787c "$d/meld.tar.gz" \
          | sha256sum -c -
        tar -xzf "$d/kiln.tar.gz" -C "$d"
        tar -xzf "$d/meld.tar.gz" -C "$d"
        mkdir -p "$d/bin"
        ln -s "$(find "$d" -type f -name kiln -perm -u+x | head -1)" "$d/bin/kiln"
        ln -s "$(find "$d" -type f -name meld -perm -u+x | head -1)" "$d/bin/meld"
        if PATH="$d/bin:$PATH" scripts/run-wsc-cli-wasm.sh kiln "$RUNNER_TEMP/wsc-cli.wasm" "$RUNNER_TEMP/wsc-native"; then
          echo "::notice title=kiln runs wsc-cli.wasm::the advisory kiln leg passed; make this step blocking"
        else
          echo "::warning title=kiln advisory::wsc-cli.wasm does not run under kiln 0.9.0 (kiln#745); not blocking"
        fi

    # Audit 2026-04-30 finding C-7 (partial): Bazel CI now ATTEMPTS to
    # run tests, not just validate that targets compile. continue-on-error
    # is retained because (a) macOS Bazel toolchain has unrelated issues
    # observed in this batch and (b) `bazel test //...` exposes test
    # targets that may be platform-specific. Once the macOS bazel-test
    # baseline is green for one full week, lift this mask.
    - name: Test (Bazel) (advisory)
      if: matrix.build-system == 'bazel'
      run: bazel test --build_tests_only --test_output=errors //src/...
      continue-on-error: true  # WIP — see audit C-7 partial closure

    - name: Validate Build Outputs (Bazel)
      if: matrix.build-system == 'bazel'
      run: |
        echo "✅ Querying build outputs:"

        # Query actual output files for each target
        echo "Component library outputs:"
        bazel cquery //src/component:signing_lib --output=files 2>/dev/null || echo "  (query failed)"

        echo "CLI binary outputs:"
        bazel cquery //src/cli:wasmsign_cli --output=files 2>/dev/null || echo "  (query failed)"

        # List what's actually in bazel-bin
        echo ""
        echo "Contents of bazel-bin/src/component/:"
        ls -lh bazel-bin/src/component/ 2>/dev/null || echo "  (directory not found)"

        echo ""
        echo "Contents of bazel-bin/src/cli/:"
        ls -lh bazel-bin/src/cli/ 2>/dev/null || echo "  (directory not found)"

        # Find any WASM files (if built with --platforms flag)
        echo ""
        echo "Searching for WASM files:"
        find bazel-bin -name "*.wasm" -type f 2>/dev/null | while read wasm_file; do
          echo "  Found: $wasm_file"
          file "$wasm_file"
        done || echo "  (no .wasm files found - native build only)"

    - name: Upload Build Artifacts (Bazel)
      if: matrix.build-system == 'bazel'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bazel-outputs-${{ matrix.os }}
        path: |
          bazel-bin/src/component/**/*
          bazel-bin/src/cli/**/*
          !bazel-bin/**/*.d
          !bazel-bin/**/*.rlib
        retention-days: 7
        if-no-files-found: warn

  # Integration tests for keyless signing (requires OIDC)
  keyless-integration:
    name: Keyless Integration Tests
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    permissions:
      id-token: write  # Required for OIDC token
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Keyless Integration Tests
      run: cargo test --locked --test keyless_integration -- --ignored --nocapture
      env:
        RUST_LOG: debug

  # Air-gapped verification end-to-end tests
  airgapped-e2e:
    name: Air-Gapped E2E Tests
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    permissions:
      id-token: write  # Required for OIDC token
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Air-Gapped Unit Tests
      run: cargo test --locked --test airgapped_e2e -- --nocapture
      env:
        RUST_LOG: info

    - name: Run Air-Gapped Integration Tests (with OIDC)
      run: cargo test --locked --test airgapped_e2e -- --ignored --nocapture
      env:
        RUST_LOG: debug

  # Example: Sign a WASM module and verify with air-gapped flow
  sign-and-verify-example:
    name: Sign & Verify Example
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build CLI
      run: cargo build --locked --release

    # #366: a gate may trust `wsc verify`'s exit code. Tampered payload,
    # tampered signature, wrong key and unsigned module must each exit
    # non-zero; the self-test proves the check fails a fail-open verify.
    - name: CLI exit contract (verify fails closed)
      run: |
        scripts/cli-exit-contract.sh ./target/release/wsc
        scripts/cli-exit-contract.sh --self-test ./target/release/wsc

    - name: Generate bundle signing keypair
      run: |
        ./target/release/wsc keygen -k /tmp/bundle-sk.key -K /tmp/bundle-pk.key
        echo "Generated bundle signing keypair"

    - name: Fetch and sign trust bundle from Sigstore
      run: |
        ./target/release/wsc bundle fetch \
          -o /tmp/trust-bundle.json \
          --version 1 \
          --validity-days 90 \
          --sign /tmp/bundle-sk.key
        echo "Fetched and signed trust bundle"

    - name: Inspect trust bundle
      run: ./target/release/wsc bundle inspect -i /tmp/trust-bundle.json

    - name: Verify trust bundle signature
      run: |
        ./target/release/wsc bundle verify \
          -i /tmp/trust-bundle.json \
          -K /tmp/bundle-pk.key
        echo "Trust bundle signature verified"

    - name: Create test WASM module
      run: |
        # Create a minimal valid WASM module
        printf '\x00\x61\x73\x6d\x01\x00\x00\x00' > /tmp/test.wasm
        echo "Created test WASM module"

    - name: Sign WASM with keyless signing
      run: |
        ./target/release/wsc sign --keyless \
          -i /tmp/test.wasm \
          -o /tmp/test-signed.wasm
        echo "Signed WASM module with keyless signing"

    - name: Verify keyless signature
      run: |
        ./target/release/wsc verify --keyless \
          -i /tmp/test-signed.wasm
        echo "Verified keyless signature"

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signed-wasm-artifacts
        path: |
          /tmp/trust-bundle.json
          /tmp/bundle-pk.key
          /tmp/test-signed.wasm
        retention-days: 7

  # Rekor verification tests with fresh data
  rekor-verification:
    # "(advisory)": the test step runs with continue-on-error.
    name: Rekor Verification Tests (Fresh Data) (advisory)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Fetch Fresh Rekor Data
      id: update-rekor
      run: |
        ./scripts/update-rekor-test-data.sh > rekor-data.txt 2>&1
        echo "✅ Fetched fresh Rekor test data"

    - name: Run Rekor Verification Tests
      # Continue even if tests fail - data might be stale or API unavailable
      continue-on-error: true
      run: |
        echo "📝 Note: These tests use hardcoded data and may fail if not recently updated"
        cargo test --locked signature::keyless::rekor_verifier::tests -- --ignored --nocapture
      env:
        RUST_LOG: debug

    - name: Upload Rekor Data (on failure)
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rekor-fresh-data
        path: rekor-data.txt
        retention-days: 7

  coverage:
    name: Code Coverage
    needs: [build-matrix]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: cargo-llvm-cov
    - name: Generate coverage (LCOV + HTML)
      # Include wsc-dsse: the DSSE code was carved out of wsc into its own crate
      # (#218), so `-p wsc` alone no longer sees it and its moved tests wouldn't
      # count — codecov would report the moved lines as uncovered. Likewise
      # wsc-verify-core (core offline-verification crate) and wsc-attestation:
      # both are lib-bearing members that were previously unmeasured, so their
      # coverage went unreported (REQ-30 / #258; enforced by the
      # vacuous-oracle-gate job below).
      run: |
        cargo llvm-cov --locked -p wsc -p wsc-dsse -p wsc-verify-core -p wsc-attestation --lcov --output-path lcov.info
        cargo llvm-cov --locked -p wsc -p wsc-dsse -p wsc-verify-core -p wsc-attestation --html --output-dir coverage-html
    - name: Upload LCOV to Codecov
      if: (env.CODECOV_TOKEN != '') && github.event.pull_request.head.repo.fork != true
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html
        path: coverage-html/
