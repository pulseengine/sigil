name: Supply Chain Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # The merge queue: run on the merge-group commit too, so the queue tests
  # the merged result. merge_group takes no paths filter: it always runs.
  merge_group:
  push:
    branches: [main]
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - 'scripts/lockfile-gate.sh'
      - 'verification/lockfile-controls/**'
      - 'supply-chain/**'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - 'scripts/lockfile-gate.sh'
      - 'verification/lockfile-controls/**'
      - 'supply-chain/**'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/supply-chain.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cargo-vet:
    # "(advisory)": `cargo vet` runs with continue-on-error.
    name: Cargo Vet (advisory)
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-vet
      run: cargo install --locked cargo-vet
    - name: Run cargo vet
      run: cargo vet
      continue-on-error: true

  cargo-audit:
    name: Cargo Audit
    # Stays on ubuntu-24.04: smithy-shipped cargo-audit's bundled rustsec parser rejects RUSTSEC-2026-0037 ("unsupported CVSS version: 4.0"). Move back once smithy bumps cargo-audit to 0.22.1+.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-audit
      run: cargo install --locked cargo-audit
    - name: Every cargo root has a committed, current lock
      # Each lock must pass `cargo metadata --locked`; a planted control per
      # lock (one [[package]] entry removed) must be refused. See the script.
      run: scripts/lockfile-gate.sh locked
    - name: Run cargo audit on every committed Cargo.lock
      # NOTE: advisories are gated HERE only. The cargo-deny job below runs
      # bans/licenses/sources, so deny.toml's [advisories].ignore is not the
      # gate and the two lists are not actually kept in sync.
      #
      # Every Cargo.lock in the repository is audited, not only the root one:
      # examples/wasmtime-loader carried 14 zstd/zstd-safe advisories that the
      # root-only audit never saw (fixed in the PR that added this). A planted
      # smallvec 1.6.0 lock must fail on RUSTSEC-2021-0003.
      #
      # No --ignore lines. The eight that were here (RUSTSEC-2025-0046,
      # -2025-0118, -2026-0006, -2026-0020, -2026-0021, -2025-0057,
      # -2025-0134, -2024-0436) matched no crate in any lock on 2026-11-22,
      # so each was a standing exemption with nothing left to exempt. A new
      # exception goes here with its reason and its retirement condition.
      run: scripts/lockfile-gate.sh audit

  cargo-deny:
    name: Cargo Deny
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # stable
    # EmbarkStudios/cargo-deny-action@v2 runs in a musl container that can't
    # install the toolchain pinned by rust-toolchain.toml (issue #103). Also
    # fails on smithy (rootless container + NoNewPrivileges). Install +
    # invoke cargo-deny directly so the runner's rustup respects the project
    # toolchain file. bans/licenses/sources only — advisories live in the
    # cargo-audit job above.
    - name: Install cargo-deny
      run: cargo install --locked cargo-deny --version 0.16.4
    - name: Run cargo deny check
      run: cargo deny check bans licenses sources

  mutants:
    name: Mutation Testing
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lean-mem"]') || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Install cargo-mutants
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-mutants
    - name: Run mutation testing on security-critical modules
      run: |
        cargo mutants -p wsc --timeout 120 --jobs 4 --output mutants-wsc \
          -f src/lib/src/signature/ \
          -f src/lib/src/dsse.rs \
          -f src/lib/src/format/ \
          -E "proofs::" \
          -E "key_id" \
          -- --lib
    # The classic verification core lives in `wsc-verify-core` after the
    # carve. Running cargo-mutants on it too keeps the zero-survivor gate
    # on the moved signature code — without this step the original `-f
    # src/lib/src/signature/` filter would silently match almost nothing
    # post-merge and the gate would pass for the wrong reason.
    - name: Run mutation testing on wsc-verify-core (carved verification core)
      run: |
        cargo mutants -p wsc-verify-core --timeout 120 --jobs 4 \
          --output mutants-verify-core \
          -f src/verify-core/src/signature/ \
          -E "proofs::" \
          -- --lib
    - name: Check surviving mutants
      run: |
        missed_count() {
          if [ -f "$1/missed.txt" ]; then
            wc -l < "$1/missed.txt" | tr -d ' '
          else
            echo 0
          fi
        }
        WSC=$(missed_count mutants-wsc)
        CORE=$(missed_count mutants-verify-core)
        TOTAL=$((WSC + CORE))
        echo "Surviving mutants: wsc=$WSC, wsc-verify-core=$CORE, total=$TOTAL"
        if [ "$TOTAL" -gt 0 ]; then
          echo "::error::$TOTAL mutant(s) survived — tests must catch all mutations in security-critical code"
          for d in mutants-wsc mutants-verify-core; do
            if [ -f "$d/missed.txt" ]; then
              echo "--- $d/missed.txt ---"
              head -15 "$d/missed.txt"
            fi
          done
          exit 1
        fi
        echo "All mutants killed!"
    - name: Upload mutants reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutants-reports
        path: |
          mutants-wsc/
          mutants-verify-core/
