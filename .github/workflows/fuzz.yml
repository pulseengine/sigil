# Fuzz testing workflow for security-critical parsing code
# Addresses Issue #7: Add fuzz testing for signature parsing/validation logic

name: Fuzz Testing

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration per target (seconds)'
        required: false
        default: '1800'

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lean-mem"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # Cap concurrency: the lean-mem pool is 4 runners shared with rivet's
      # nightly mutants-core. Without this, all 10 targets fire at once,
      # queue for up to ~10 h, and collide with mutants-core (#146). Two at a
      # time bounds the fuzz window to a few hours and leaves 2 runners free.
      max-parallel: 2
      matrix:
        # All 10 cargo-fuzz targets declared in `fuzz/Cargo.toml`. The
        # matrix had silently fallen behind as new targets were added —
        # keep this list in sync with `fuzz/Cargo.toml [[bin]]` entries.
        target:
          - fuzz_varint
          - fuzz_keyless_signature
          - fuzz_module_parsing
          - fuzz_signature_data
          - fuzz_public_key
          - fuzz_rekor_entry
          - fuzz_dsse_envelope
          - fuzz_elf_parsing
          - fuzz_format_detection
          - fuzz_mcuboot_parsing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Create corpus directory
        run: mkdir -p fuzz/corpus/${{ matrix.target }}

      - name: Run fuzzer
        env:
          # Default 30-minute budget per target for the nightly schedule
          # (previously 5 min). On manual dispatch the workflow input
          # overrides this. The matrix runs all 10 targets in parallel on
          # smithy lean-mem runners so wall-clock stays ~30 min while
          # per-target depth rises 6×. Inputs interpolated via env: to
          # keep the matrix value out of the shell template (workflow-
          # injection-safe pattern).
          DEFAULT_DURATION: '1800'
          DURATION_INPUT: ${{ github.event.inputs.duration }}
          TARGET: ${{ matrix.target }}
        run: |
          cd fuzz
          DURATION="${DURATION_INPUT:-$DEFAULT_DURATION}"
          echo "Fuzzing ${TARGET} for ${DURATION} seconds..."
          cargo +nightly fuzz run "${TARGET}" -- -max_total_time="${DURATION}"
        # No continue-on-error: a crash, OOM, timeout or failed build is a red
        # leg. The uploads below run on always(), so the reproducer still lands.

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Fuzz Report
    needs: fuzz
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Verdict self-test
        run: scripts/fuzz-verdict.sh --self-test

      # Fails on any file libFuzzer left in fuzz/artifacts (crash, oom,
      # timeout, leak, slow-unit), on a target from fuzz/Cargo.toml with no
      # corpus (it never ran), and on a matrix that did not succeed. It used to
      # count only crash-* files, so the other findings and a fuzzer that never
      # built both reported "No crashes found".
      - name: Judge the fuzz run
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: scripts/fuzz-verdict.sh artifacts "$FUZZ_RESULT" fuzz/Cargo.toml
