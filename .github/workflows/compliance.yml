name: Compliance Report

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      version:
        description: 'Version label for the report'
        type: string
        default: ''
      theme:
        description: 'Color theme (dark or light)'
        type: string
        default: 'dark'
    outputs:
      archive-path:
        description: 'Path to the compliance archive'
        value: ${{ jobs.compliance.outputs.archive-path }}
      validation-result:
        description: 'PASS or FAIL'
        value: ${{ jobs.compliance.outputs.validation-result }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the report'
        type: string
        default: ''
      theme:
        description: 'Color theme (dark or light)'
        type: choice
        options: [dark, light]
        default: 'dark'

jobs:
  compliance:
    name: Generate compliance report
    # Stays on ubuntu-latest: uses pulseengine/rivet/.github/actions/compliance composite action whose internals (likely docker compose / pandoc / weasyprint) are not yet validated against smithy's hardened runner.
    runs-on: ubuntu-latest
    outputs:
      archive-path: ${{ steps.report.outputs.archive-path }}
      validation-result: ${{ steps.report.outputs.validation-result }}
    steps:
    - uses: actions/checkout@v7

    - name: Generate compliance report
      id: report
      uses: pulseengine/rivet/.github/actions/compliance@v0.39.0
      with:
        theme: ${{ inputs.theme }}
        report-label: ${{ inputs.version }}
        # Must track the compliance action version above. This was frozen at
        # v0.3.0 while dependabot advanced the action (0.32 -> 0.35 on
        # 2026-09-01, then 0.37, 0.39); release.yml first failed 2026-09-08,
        # the next release run after that bump. A rivet 0.3.0 cannot parse this
        # repo's schemas (dev@0.4.0, on-disk stpa-sec, external-anchor). #284.
        rivet-version: v0.39.0

    - name: Upload archive
      uses: actions/upload-artifact@v7
      with:
        name: compliance-report
        path: ${{ steps.report.outputs.archive-path }}
