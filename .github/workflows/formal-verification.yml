name: Formal Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/src/**'
      - 'src/lib/tests/**'
      - 'src/verify-core/**'
      - 'verification/witness-harness/**'
      - 'lean/**'
      - 'MODULE.bazel'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'src/lib/src/**'
      - 'src/lib/tests/**'
      - 'src/verify-core/**'
      - 'verification/witness-harness/**'
      - 'lean/**'
      - 'MODULE.bazel'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  verus-proofs:
    name: Verus SMT Verification
    # Stays on ubuntu-latest: uses bazel-contrib/setup-bazel; Bazel is not installed on smithy (tracked as out-of-scope in migration playbook).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    # Audit 2026-04-30 finding C-7 (partial): the previous classification
    # of "passes" assumed continue-on-error masking made these jobs green.
    # Lifting the mask reveals real failures tied to audit C-1 — Verus
    # `theorem_*` functions in src/lib/src/verus_proofs/ end in
    # `assume(false)` and the proof obligations are not yet discharged.
    # Mask retained until those obligations are mechanised; the job stays
    # visible (no skip) so progress is observable.
    - name: Verify Merkle proofs (CV-20, CV-21)
      run: bazel build //src/lib/src/verus_proofs:wsc_merkle_proofs
      continue-on-error: true  # WIP — see audit C-1

    - name: Run Verus tests
      run: bazel test //src/lib/src/verus_proofs:wsc_merkle_verify
      continue-on-error: true  # WIP — see audit C-1

  kani-proofs:
    name: Kani ${{ matrix.module }}
    # Stays on ubuntu-latest: kani-verifier bundles CBMC (~100 MB) which is not in smithy's toolchains role (tracked as out-of-scope in migration playbook).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: varint
            # `wasm_module::varint` lives in `wsc-verify-core` after the
            # carve, so the harness must be invoked against that crate.
            pkg: wsc-verify-core
            harness: wasm_module::varint
            tolerate_failure: false
          # merkle was ONE masked entry running all five harnesses in a single
          # `cargo kani` invocation. Two of them are pure integer arithmetic and
          # VERIFIED; three hash symbolic input and FAIL. With sha2 0.11 (the
          # RustCrypto 0.14 migration) the three SHA-256 harnesses reproducibly
          # exhausted the runner ~1.1 min into proving — exit 143, "the runner
          # has received a shutdown signal", twice on different runners, where
          # sha2 0.10 finished in 0.7 min. Because all five shared one
          # invocation, the two good proofs produced no evidence either. Split:
          #
          # merkle-arith — the index math behind Merkle inclusion proofs. No
          # SHA-256, verified on both sha2 lines, so it is UNMASKED: a second
          # real Kani gate, alongside `varint`.
          - module: merkle-arith
            pkg: wsc
            harness: signature::keyless::merkle::proofs_arith
            tolerate_failure: false
          # merkle-sha256 — WIP, see audit C-7. The sha2 compression loop
          # exceeds --default-unwind 4, and proof_leaf_node_domain_separation
          # asks Kani to prove SHA-256 collision-resistance, which is outside
          # bounded model checking entirely. Masked, and memory-CAPPED: under
          # sha2 0.11 these exhaust the VM, and a runner killed from outside is
          # a RED job that masking cannot absorb. The cap turns exhaustion into
          # an ordinary failed (masked) step. The split is mirrored in the code
          # (merkle.rs `proofs_arith` / `proofs_sha256`), so both selectors are
          # MODULE paths: the vacuous-oracle gate resolves selectors to module
          # granularity, never to a single harness function.
          - module: merkle-sha256
            pkg: wsc
            harness: signature::keyless::merkle::proofs_sha256
            mem_limit_kb: 12582912
            tolerate_failure: true
          - module: dsse
            # The DSSE `compute_pae` proofs live in `wsc-dsse` after the carve
            # (issue #218 / REQ-24), so the harness must be invoked against that
            # crate — invoking `-p wsc` would match zero harnesses and the gate
            # would report green without running anything.
            pkg: wsc-dsse
            harness: dsse
            # WIP — CI observation post-rebase: dsse harnesses also hit
            # "unwinding assertion loop 0" at --default-unwind 4. The
            # PAE-prefix harnesses iterate over the prefix bytes; needs
            # higher per-harness #[kani::unwind] before this can be
            # unmasked. Static analysis in this PR missed the memcmp
            # loop inside the prefix comparison.
            tolerate_failure: true
          - module: format
            pkg: wsc
            harness: format
            # WIP — see audit C-7 partial closure. CI observation: the format
            # harnesses fail under cargo kani --default-unwind 4 despite static
            # analysis showing the properties are sound and loop-free. Suspected
            # root cause is Kani SMT slowness on 4 fully-symbolic bytes combined
            # with multiple equality checks (similar to the documented blow-up
            # noted in proof_consistency_validation_agrees_with_detection).
            # Next attempt: try concretizing each magic-byte pattern as its own
            # harness rather than enumerating in one 4-byte-symbolic harness.
            tolerate_failure: true
          - module: wasm_module
            # `wasm_module::component_proofs` lives in `wsc-verify-core`
            # after the carve, so the harness must be invoked against that
            # crate. Filter was wasm_module::tests, which matched no
            # harness (the module is named component_proofs, not tests).
            # Fixed in this PR so the single harness — header mutual-
            # exclusivity — actually runs. CI observation: the harness
            # hits an unwinding-loop assertion inside <builtin-library-
            # memcmp> at the default unwind of 4. Static analysis missed
            # this; the harness's equality check on the 8-byte header
            # lowers to memcmp at the MIR level. Needs a per-harness
            # #[kani::unwind(9)] (or rewriting the equality as a per-byte
            # comparison) before this can be unmasked. Filter-fix lands
            # here; harness-fix is a follow-up.
            pkg: wsc-verify-core
            harness: wasm_module::component_proofs
            tolerate_failure: true
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      run: |
        rustup update stable
        rustup default stable

    - name: Install Kani
      run: |
        cargo install --locked kani-verifier
        cargo kani setup

    # Audit 2026-04-30 finding C-7 (partial): the mask is per-matrix-entry via
    # matrix.tolerate_failure. TWO modules run unmasked — `varint` (5/5) and
    # `merkle-arith` (2/2), the latter split out of merkle so its two verified
    # proofs stopped sharing an invocation with three SHA-256 harnesses that
    # exhaust the runner. merkle-sha256, dsse, format and wasm_module are
    # masked, each with its diagnosis at the matrix include site above.
    #
    # This comment previously claimed "varint, dsse, and wasm_module run
    # unmasked", which the matrix below contradicts: a reader believed 3 of 5
    # were real gates when only 1 is. Measured on main @74665d9b, every masked
    # module exited 1 while its job reported success — merkle 3 failed of 5,
    # format 2 of 4, dsse 1 of 1, wasm_module 1 of 1, i.e. SEVEN failing
    # harnesses behind a green board. claims.yaml's KANI-MASK-RATCHET keeps
    # that number from growing silently; unmasking them is #145.
    - name: Run Kani ${{ matrix.module }} proofs
      env:
        HARNESS: ${{ matrix.harness }}
        PACKAGE: ${{ matrix.pkg }}
        MEM_LIMIT_KB: ${{ matrix.mem_limit_kb }}
      # HARNESS may name several harnesses, separated by whitespace; each
      # becomes its own `--harness`. MEM_LIMIT_KB, when a matrix entry sets it,
      # caps the virtual memory of this step so a runaway proof fails inside the
      # step instead of taking the runner VM down with it.
      run: |
        harness_args=()
        for h in $HARNESS; do harness_args+=(--harness "$h"); done
        if [ -n "$MEM_LIMIT_KB" ]; then ulimit -v "$MEM_LIMIT_KB"; fi
        cargo kani -p "$PACKAGE" --default-unwind 4 --output-format terse "${harness_args[@]}"
      timeout-minutes: 60
      continue-on-error: ${{ matrix.tolerate_failure }}

  rocq-proofs:
    name: Rocq/coq-of-rust Translation
    # Stays on ubuntu-latest: uses cachix/install-nix-action + bazel-contrib/setup-bazel + Rocq/Coq toolchain; none of Nix, Bazel, or Rocq are installed on smithy (all tracked as out-of-scope in migration playbook).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-rocq
        repository-cache: true

    - name: Translate PAE to Rocq and compile proof
      run: bazel build //verification/rocq:pae_verified
      timeout-minutes: 30
      # coq-of-rust needs Rust nightly with LLVM internals — Nix provides
      # this locally but CI may need LIBRARY_PATH configuration.
      # WIP — see audit C-3: verification/rocq/ is a translation-pipeline
      # stub, not a real Rocq proof. continue-on-error stays until a `.v`
      # file is wired in.
      continue-on-error: true

  # MC/DC branch-coverage gate on wsc-verify-core via the witness harness
  # (#165 Track C / #128). Unlike the WIP proof jobs above, this is a real
  # gate (no continue-on-error): it fails only if the MC/DC gap count rises
  # past the committed baseline, so it cannot block on incomplete proofs —
  # only on an actual coverage regression.
  witness-mcdc:
    name: Witness MC/DC gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Installs the pinned toolchain (1.96.1) from rust-toolchain.toml.
    - name: Install pinned Rust toolchain
      run: rustup show

    # Milliseconds, and it runs FIRST: if the gate's verdict logic has drifted,
    # the number it prints below is not worth reading. Covers the empty-scope
    # guard, the regression trip, and that recalibrating the baseline for the
    # 1.96 codegen did not make the gate toothless.
    - name: Witness gate verdict table
      run: bash verification/witness-harness/gate-logic-test.sh

    - name: Run witness MC/DC regression gate
      run: bash verification/witness-harness/witness-gate.sh
      env:
        # `gh release download` (to fetch the pinned witness binary) needs a token.
        GH_TOKEN: ${{ github.token }}
