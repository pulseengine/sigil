name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.7)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pulseengine/wsc

jobs:
  # Generate compliance report from rivet artifacts
  build-compliance:
    name: Build compliance report
    # Stays on ubuntu-latest: uses pulseengine/rivet/.github/actions/compliance composite action whose internals are not yet validated against smithy's hardened runner.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # rivet.yaml declares `synth` as an external at ../synth, and ONE
    # unresolvable external makes rivet abandon cross-ref checking for all of
    # them: it reports "cross-refs NOT CHECKED — externals failed to load" and
    # counts sigil's 9 valid synth links as broken (31 validate errors instead
    # of 22). A single-repo checkout has no sibling, so the compliance job saw
    # that state on every run. actions/checkout refuses to write outside
    # GITHUB_WORKSPACE, so clone it directly: $GITHUB_WORKSPACE is
    # .../work/sigil/sigil, and rivet resolves ../synth against the project
    # dir, so .../work/sigil/synth is exactly where it looks.
    #
    # PINNED, not `main`, deliberately. A compliance bundle is audit evidence:
    # re-running the release must re-derive the same report, which a moving
    # HEAD cannot promise. The cost is that a cross-ref sigil still claims
    # could rot in synth's later commits without this job noticing — that drift
    # surfaces in a developer's local run, where ../synth is a live checkout,
    # and when this pin is next raised. claims.yaml's SYNTH-PIN-AGREES keeps
    # the two callers from disagreeing about which pin that is.
    - name: Check out synth (rivet external, for cross-repo links)
      run: |
        git clone --depth 1 --branch v0.87.0 \
          https://github.com/pulseengine/synth "${GITHUB_WORKSPACE}/../synth"

    - name: Generate compliance report
      id: report
      uses: pulseengine/rivet/.github/actions/compliance@29ca43828c8060af135fcd47ecff4c48662d1567 # v0.41.1
      with:
        theme: dark
        # The rivet BINARY the action downloads. Must equal the action tag
        # above; claim RIVET-ACTION-PIN-AGREES in claims.yaml enforces it, so
        # dependabot can no longer advance one and leave the other behind —
        # which is what broke eight releases from 2026-09-08 (#284). Do not
        # drop this input: its default "source" builds rivet-cli from the
        # CALLER's workspace, and sigil has no rivet-cli crate.
        rivet-version: v0.41.1
        # Emit artifacts.yaml (generic-yaml) into the bundle so the website's
        # fetch-reports can auto-generate data/sigil/{stats,artifacts}.json.
        include-data-formats: true

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: compliance-report
        path: ${{ steps.report.outputs.archive-path }}

  # Build native CLI binaries for all platforms
  build-native-cli:
    name: Build CLI (${{ matrix.target }})
    # Stays on ubuntu-latest / macos / windows: matrix spans macOS + Windows (smithy is Linux-only) and Linux entries use sudo apt-get for cross-compilation toolchains and libtss2-dev.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: wsc
            asset_name: wsc-linux-x86_64
          # Linux x86_64 with TPM2
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: wsc
            asset_name: wsc-linux-x86_64-tpm2
            features: tpm2
          # Linux aarch64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: wsc
            asset_name: wsc-linux-aarch64
            cross: true
          # macOS x86_64 (Intel) - using macos-15-intel (macos-13 deprecated Dec 2025)
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: wsc
            asset_name: wsc-macos-x86_64
          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: wsc
            asset_name: wsc-macos-aarch64
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: wsc.exe
            asset_name: wsc-windows-x86_64.exe

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      run: |
        rustup update stable
        rustup default stable
        rustup target add ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux aarch64)
      if: matrix.cross
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Install TPM2 dependencies
      if: matrix.features == 'tpm2'
      run: |
        sudo apt-get update
        sudo apt-get install -y libtss2-dev

    - name: Build CLI
      run: |
        cargo build --release --bin wsc --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

    - name: Create artifact directory
      shell: bash
      run: |
        mkdir -p artifacts
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

    # Per-file .sha256 sidecars are intentionally NOT generated here.
    # The release-publish job (build-and-release) emits a single signed
    # SHA256SUMS.txt covering every asset — matches the synth release flow.

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.asset_name }}
        path: artifacts/*
        retention-days: 1

  # NOTE: crates.io publishing lives in `.github/workflows/publish-to-crates-io.yml`
  # to keep tag-push publication single-sourced (avoids the dual-publish race).

  build-and-release:
    name: Build & Release WASM Component
    # Stays on ubuntu-latest: uses sudo apt-get for build-essential, plus cachix/install-nix-action and bazel-contrib/setup-bazel; smithy has no sudo and no Nix or Bazel.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write       # Cosign keyless signing + SLSA provenance OIDC
      attestations: write   # actions/attest-build-provenance@v4
    # build-compliance is a release gate (#352). It used to be absent here, so
    # the compliance-report download below raced an independent job and was
    # `continue-on-error: true` — a release could ship without its V-model
    # evidence and stay green. build-compliance has no job-level `if:`, so it
    # runs under every trigger this job does.
    needs: [build-native-cli, build-compliance]
    if: always() && needs.build-native-cli.result == 'success' && needs.build-compliance.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup C++ Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++

    # Nix is required for rules_rocq_rust toolchain registered in MODULE.bazel
    # (Bazel evaluates all toolchains during loading, even for non-Rocq builds)
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        # Use a shared cache key across all builds for better reuse
        disk-cache: ${{ runner.os }}-bazel
        repository-cache: true

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.4.1'

    - name: Verify cosign version
      run: cosign version

    - name: Build WASM Components
      run: |
        echo "Building wsc WebAssembly components..."

        # Build component library (WIT interface)
        echo "Building signing library component..."
        bazel build //src/component:signing_lib_release

        # Build CLI WASM binary with wasm32-wasip2 platform
        echo "Building CLI WASM binary..."
        bazel build //src/cli:wasmsign_cli_wasm --platforms=@rules_wasm_component//platforms:wasm32-wasip2

        # Find and copy the component WASM
        # Pattern: bazel-out/<platform>-fastbuild-ST-<hash>/bin/src/component/*.wasm
        COMPONENT_WASM=$(ls bazel-out/k8-fastbuild-ST-*/bin/src/component/*.wasm 2>/dev/null | head -n 1)

        if [ -z "$COMPONENT_WASM" ]; then
          echo "Error: Could not find component WASM file"
          echo "Searching for any WASM files in bazel-out:"
          find bazel-out -name "*.wasm" -type f
          exit 1
        fi

        echo "Found component WASM: $COMPONENT_WASM"
        cp "$COMPONENT_WASM" ./wsc-component.wasm

        # Find and copy the CLI WASM if it exists
        # After building with --platforms flag, it's at bazel-bin/src/cli/wasmsign_cli.wasm
        CLI_WASM="bazel-bin/src/cli/wasmsign_cli.wasm"

        # #352: this used to warn "will only release component" and carry on,
        # and the build above swallowed its own failure — so a broken CLI build
        # silently shrank the release, and the "HARD requirement" signing of
        # wsc-cli.wasm further down (guarded by `[ -f wsc-cli.wasm ]`) was
        # skipped with it. wsc-cli.wasm is a release asset: missing is fatal.
        if [ ! -f "$CLI_WASM" ]; then
          echo "::error::CLI WASM not found at $CLI_WASM — the build above must produce it; a release without wsc-cli.wasm is not shipped"
          exit 1
        fi
        echo "Found CLI WASM: $CLI_WASM"
        cp "$CLI_WASM" ./wsc-cli.wasm

        # Verify files
        echo "Built WASM files:"
        ls -lh wsc-*.wasm
        file wsc-*.wasm

    - name: Build wsc Native CLI
      run: |
        echo "Building wsc native CLI for signing..."
        cargo build --release --bin wsc

        # Verify the CLI works
        ./target/release/wsc --version

        echo "✅ Native wsc CLI built"

    - name: Sign WASM Files with wsc (Keyless)
      run: |
        echo "🔐 Signing WASM artifacts with wsc keyless signing..."

        # Sign the component WASM with keyless signing
        echo "Signing wsc-component.wasm..."
        ./target/release/wsc sign --keyless \
          --input-file wsc-component.wasm \
          --output-file wsc-component.signed.wasm

        # Create a detached signature for verification
        mv wsc-component.signed.wasm wsc-component.wasm

        # Sign the CLI WASM if the wasip2 build produced it. wsc's parser
        # DOES handle the wasm32-wasip2 component format (verified 2026-07:
        # sign + verify round-trip on a real 3.98 MB component with an
        # embedded core module — #164), and wsc-component.wasm (also wasip2)
        # is already signed unconditionally above. So this is a HARD
        # requirement: a sign failure fails the release loudly instead of
        # silently dropping the unsigned artifact (no continue-on-error theatre).
        test -f wsc-cli.wasm || { echo "::error::wsc-cli.wasm missing — the build step requires it (#352)"; exit 1; }
        echo "Signing wsc-cli.wasm..."
        ./target/release/wsc sign --keyless \
          --input-file wsc-cli.wasm \
          --output-file wsc-cli.signed.wasm \
          || { echo "::error::wsc-cli.wasm (wasm32-wasip2) failed to sign — component-parser regression (#164)"; exit 1; }
        mv wsc-cli.signed.wasm wsc-cli.wasm
        echo "  ✅ wsc-cli.wasm signed"

        echo "✅ WASM files signed with wsc (keyless)"
        echo ""
        echo "📋 Signature Details:"
        echo "  - Identity: GitHub Actions OIDC"
        echo "  - Certificate: Short-lived from Fulcio"
        echo "  - Transparency: Logged in Rekor"

    # Per-file .sha256 sidecars dropped: the unified signed SHA256SUMS.txt
    # below covers wsc-component.wasm, wsc-cli.wasm, and every other asset.

    - name: Log in to Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create OCI Image with WASM Component
      run: |
        # Install oras for OCI artifact management
        VERSION="1.2.2"
        curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
        mkdir -p oras-install/
        tar -zxf "oras_${VERSION}_linux_amd64.tar.gz" -C oras-install/
        sudo mv oras-install/oras /usr/local/bin/
        rm -rf "oras_${VERSION}_linux_amd64.tar.gz" oras-install/

        # Determine tag
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        elif [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        else
          # For push to branches, use branch name + short SHA
          TAG="${{ github.ref_name }}-${GITHUB_SHA:0:7}"
        fi

        # Sanitize tag for OCI (replace / with -)
        TAG="${TAG//\//-}"

        # Create OCI artifact references
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
        IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

        # Push component WASM as OCI artifact
        echo "Publishing wsc component..."
        oras push "${IMAGE_TAG}" \
          --artifact-type application/vnd.wasm.component.layer.v1+wasm \
          wsc-component.wasm:application/vnd.wasm.component.layer.v1+wasm

        # Tag as latest
        oras tag "${IMAGE_TAG}" latest

        # Push CLI WASM as OCI artifact (required since #352)
        test -f wsc-cli.wasm || { echo "::error::wsc-cli.wasm missing — the build step requires it (#352)"; exit 1; }
        CLI_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-cli"
        CLI_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cli"

        echo "Publishing wsc CLI..."
        oras push "${CLI_TAG}" \
          --artifact-type application/vnd.wasm.component.layer.v1+wasm \
          wsc-cli.wasm:application/vnd.wasm.component.layer.v1+wasm

        # Tag as latest-cli
        oras tag "${CLI_TAG}" latest-cli

        echo "CLI_TAG=${CLI_TAG}" >> $GITHUB_ENV
        echo "CLI_LATEST=${CLI_LATEST}" >> $GITHUB_ENV

        echo "Published OCI artifacts:"
        echo "  Component: ${IMAGE_TAG}"
        echo "  Component (latest): ${IMAGE_LATEST}"
        echo "  CLI: ${CLI_TAG}"
        echo "  CLI (latest): ${CLI_LATEST}"

        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "IMAGE_LATEST=${IMAGE_LATEST}" >> $GITHUB_ENV

    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Resolve image digests
      id: digest
      run: |
        COMPONENT_DIGEST=$(crane digest "${IMAGE_TAG}")
        echo "component=${COMPONENT_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Resolved ${IMAGE_TAG} to ${COMPONENT_DIGEST}"

        LATEST_DIGEST=$(crane digest "${IMAGE_LATEST}")
        echo "latest=${LATEST_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Resolved ${IMAGE_LATEST} to ${LATEST_DIGEST}"

        if [ -z "${CLI_TAG:-}" ]; then echo "::error::CLI_TAG unset — the CLI image is required since #352"; exit 1; fi
        CLI_DIGEST=$(crane digest "${CLI_TAG}")
        echo "cli=${CLI_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Resolved ${CLI_TAG} to ${CLI_DIGEST}"

        CLI_LATEST_DIGEST=$(crane digest "${CLI_LATEST}")
        echo "cli_latest=${CLI_LATEST_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Resolved ${CLI_LATEST} to ${CLI_LATEST_DIGEST}"

    - name: Sign OCI Images with Cosign (digest-bound)
      run: |
        # Sign using keyless signing with GitHub OIDC, binding to digest
        echo "Signing wsc component..."
        cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.component }}"
        cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.latest }}"

        if [ -z "${CLI_TAG:-}" ]; then echo "::error::CLI_TAG unset — the CLI image is required since #352"; exit 1; fi
        echo "Signing wsc CLI..."
        cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.cli }}"
        cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.cli_latest }}"

        echo "OCI images signed with Cosign (keyless, digest-bound)"

    - name: Generate SLSA Provenance
      run: |
        # Create provenance attestation
        cat > provenance.json <<EOF
        {
          "buildType": "https://github.com/pulseengine/wsc/release@v1",
          "builder": {
            "id": "https://github.com/actions/runner"
          },
          "invocation": {
            "configSource": {
              "uri": "${{ github.server_url }}/${{ github.repository }}",
              "digest": {
                "sha1": "${{ github.sha }}"
              }
            }
          },
          "metadata": {
            "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "completeness": {
              "parameters": true,
              "environment": false,
              "materials": false
            }
          },
          "materials": [
            {
              "uri": "${{ github.server_url }}/${{ github.repository }}",
              "digest": {
                "sha1": "${{ github.sha }}"
              }
            }
          ]
        }
        EOF

        # Attest the provenance for component (digest-bound)
        cosign attest --yes \
          --predicate provenance.json \
          --type slsaprovenance \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.component }}"

        # Attest the provenance for CLI (digest-bound; required since #352)
        if [ -z "${CLI_TAG:-}" ]; then echo "::error::CLI_TAG unset — the CLI image is required since #352"; exit 1; fi
        cosign attest --yes \
          --predicate provenance.json \
          --type slsaprovenance \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.cli }}"

        echo "✅ SLSA provenance attestation created"

    - name: Generate build environment attestation
      run: |
        # Use wsc's build-env command for structured environment capture
        if command -v wsc >/dev/null 2>&1; then
          wsc build-env --json > build-env.json
          echo "Build environment attestation:"
          cat build-env.json
        else
          echo "wsc CLI not available, using basic capture"
          echo "{}" > build-env.json
        fi

    # #350: this step used to end in
    #     cosign verify ... || echo "Note: Signature verification may require specific conditions"
    # so it could never fail — a release whose image signature did not verify
    # still passed. It also matched the signer with the UNANCHORED, unescaped
    # regexp `https://github.com/<repo>`, which accepts any identity that merely
    # contains that string, and it checked one image of the up to four signed.
    #
    # Now: every image the step above signed is verified against an anchored,
    # escaped identity built from GITHUB_WORKFLOW_REF — which equals the signing
    # certificate's SAN by construction for every trigger this job runs on (main
    # pushes, tags, release events, workflow_dispatch). The single real
    # conditional is the CLI image: it is signed only when CLI_TAG is set, so it
    # is verified under exactly that condition, and the skip is logged.
    #
    # Then a negative control on every run, against this run's own fresh
    # signatures: the same verifier with a WRONG identity must reject them, or
    # the step fails — so this gate is shown to be able to go red each time it
    # passes, not just once in a PR.
    - name: Verify Signatures
      env:
        ISSUER: https://token.actions.githubusercontent.com
        COMPONENT_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.component }}
        LATEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.latest }}
        CLI_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.cli }}
        CLI_LATEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.cli_latest }}
      run: |
        identity="https://github.com/${GITHUB_WORKFLOW_REF}"
        # Escape EVERY non-alphanumeric character. Go's regexp (cosign's) reads a
        # backslash-escaped non-alphanumeric ASCII character as itself, so this
        # is exact for any ref. An earlier bracket list, [][.*^...], contained
        # `[.` -- a POSIX collating-symbol opener -- and BSD sed rejected it,
        # collapsing the regexp to `^$`: anchored, so it passed the script's
        # guard, and it would have rejected every real signature.
        identity_re="^$(printf '%s' "$identity" | sed 's/[^[:alnum:]]/\\&/g')\$"
        echo "Expected signer: ${identity}"

        if [ -z "${CLI_TAG:-}" ]; then echo "::error::CLI_TAG unset — the CLI image is required since #352"; exit 1; fi
        refs=("$COMPONENT_REF" "$LATEST_REF" "$CLI_REF" "$CLI_LATEST_REF")
        bash scripts/verify-oci-signatures.sh "$identity_re" "$ISSUER" "${refs[@]}"

        # Negative control. Output is captured, not printed, so the expected
        # rejection does not surface as an error annotation on a healthy run.
        wrong_re="^https://github\.com/${GITHUB_REPOSITORY_OWNER}/not-${GITHUB_REPOSITORY#*/}/\.github/workflows/release\.yml@.*\$"
        if neg_out=$(bash scripts/verify-oci-signatures.sh "$wrong_re" "$ISSUER" "$COMPONENT_REF" 2>&1); then
          echo "::error::cosign ACCEPTED this release's signature under a WRONG identity (${wrong_re}) — signature verification is vacuous"
          echo "$neg_out"
          exit 1
        fi
        echo "Negative control passed: a wrong signer identity is rejected, so the verification above can fail."

    # build-env.txt is captured later, alongside SBOM + SHA256SUMS, so it
    # lands in release-assets/ and its digest is captured by the signed
    # SHA256SUMS.txt below.

    - name: Download Native CLI Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: native-cli
        pattern: wsc-*
        merge-multiple: true

    - name: Download Compliance Report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: compliance-report
        path: compliance/

    - name: List downloaded artifacts
      run: |
        echo "Downloaded native CLI artifacts:"
        ls -la native-cli/
        echo "Compliance report:"
        ls -la compliance/
        find . -name "wsc-*" -type f | head -20

    # #352: this step ran `sigil sign --format elf --keyless ... || echo "Warning:
    # failed to sign"` inside a step that was ALSO `continue-on-error: true`, then
    # printed "Self-signing complete". On every release, v0.12.0 included, sigil
    # refused — "Keyless signing is currently supported only for WASM format" —
    # so no native self-signature has ever existed, and the job said it had
    # finished. The binaries were never unprotected: they are covered by the
    # cosign-signed SHA256SUMS.txt. What was false was the claim.
    #
    # scripts/sign-native-release-binaries.sh makes exactly one failure
    # skippable — sigil's own, verbatim ELF-keyless refusal (src/cli/main.rs) —
    # logged as a ::notice:: with its reason, and re-tested every run by the act
    # of signing. Any other failure is fatal. All three Linux ELF binaries are
    # required: each is an unconditional build-native-cli matrix leg, and this
    # job runs only when every leg succeeded.
    - name: Self-sign release binaries with sigil
      run: |
        chmod +x native-cli/wsc-linux-x86_64
        bash scripts/sign-native-release-binaries.sh ./native-cli/wsc-linux-x86_64 \
          native-cli/wsc-linux-x86_64 \
          native-cli/wsc-linux-aarch64 \
          native-cli/wsc-linux-x86_64-tpm2

        # Negative control, every run: a signing failure that is NOT the known
        # refusal must be fatal, or the skip above is matching too broadly. A stub
        # signer stands in so a real binary is never touched; output is captured,
        # not printed, so the expected failure is not an error annotation.
        stub="$(mktemp)"
        printf '#!/bin/sh\necho "negative control: simulated signer failure" >&2\nexit 3\n' > "$stub"
        chmod +x "$stub"
        probe="$(mktemp)"
        cp native-cli/wsc-linux-x86_64 "$probe"
        if neg_out=$(bash scripts/sign-native-release-binaries.sh "$stub" "$probe" 2>&1); then
          echo "::error::an unknown signing failure was NOT fatal — the known-refusal skip matches too broadly"
          echo "$neg_out"
          exit 1
        fi
        echo "Negative control passed: an unknown signing failure is fatal; only sigil's exact ELF-keyless refusal is skipped."

    # ── Gather every release asset into release-assets/ ───────────────────
    # The synth release pattern: one flat directory of assets, then a
    # single signed SHA256SUMS.txt that covers all of them. Everything
    # below — SBOM, sums, provenance, cosign bundle, build-env — lands
    # in release-assets/ and is uploaded as a unit.
    - name: Gather release assets
      run: |
        set -euo pipefail
        mkdir -p release-assets

        # WASM artifacts produced earlier in this job
        cp wsc-component.wasm release-assets/
        test -f wsc-cli.wasm || { echo "::error::wsc-cli.wasm missing — the build step requires it (#352)"; exit 1; }
        cp wsc-cli.wasm release-assets/

        # Native CLI binaries, plus any sigil self-signature (.sig) the signing
        # step produced. As of #352 sigil refuses ELF keyless, so there are none;
        # the binaries are covered by the cosign-signed SHA256SUMS.txt.
        for f in native-cli/*; do
          [ -f "$f" ] || continue
          case "$f" in
            *.sha256) continue ;;   # legacy sidecars from older runs — drop
          esac
          cp "$f" release-assets/
        done

        # Compliance report (complementary to SHA256SUMS — separate audit
        # artifact, not redundant with the per-asset checksum manifest)
        # build-and-release needs build-compliance (#352): the report is required.
        if [ -z "$(ls -A compliance 2>/dev/null)" ]; then echo "::error::compliance report missing or empty (#352)"; exit 1; fi
        cp -r compliance/. release-assets/

        echo "Gathered release assets:"
        ls -la release-assets/

    # Phase 6: CycloneDX SBOM for the wsc toolchain itself. The SBOM is
    # generated *before* SHA256SUMS so its digest is captured in the
    # checksum manifest; the cosign signature over SHA256SUMS.txt
    # transitively covers the SBOM.
    - name: Install cargo-cyclonedx
      run: cargo install --locked cargo-cyclonedx

    - name: Generate toolchain SBOM (CycloneDX)
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # Tag resolution mirrors the other steps in this job.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${INPUT_TAG}"
        elif [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="${{ github.ref_name }}-${GITHUB_SHA:0:7}"
        fi
        BARE="${VERSION#v}"
        # cargo-cyclonedx doesn't proxy cargo's `-p` flag — use
        # --manifest-path pointed at the wsc-cli crate (publishes the
        # `wsc` binary). Output drops next to that Cargo.toml.
        cargo cyclonedx \
          --manifest-path src/cli/Cargo.toml \
          --format json \
          --spec-version 1.5
        SBOM_SRC=$(find src/cli -maxdepth 2 -name '*.cdx.json' | head -1)
        test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
        cp "$SBOM_SRC" "release-assets/wsc-${BARE}.cdx.json"
        echo "::notice::Toolchain SBOM written to release-assets/wsc-${BARE}.cdx.json"
        ls -la release-assets/

    - name: Generate SHA256 checksums
      run: |
        set -euo pipefail
        cd release-assets
        sha256sum ./* > SHA256SUMS.txt
        cat SHA256SUMS.txt

    # ── SLSA build provenance (GitHub-native) ─────────────────────────────
    # actions/attest-build-provenance generates an in-toto SLSA v1
    # provenance statement for every release asset, signs it keyless via
    # Sigstore (Fulcio cert bound to this workflow's OIDC identity), and
    # records it in the Rekor transparency log. Consumers verify with:
    #   gh attestation verify <file> --repo pulseengine/sigil
    - name: Generate SLSA build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "release-assets/*"

    # ── Sigstore keyless signing of the sums file (cosign) ────────────────
    # Signs SHA256SUMS.txt so a consumer can verify the checksum file
    # itself was produced by this workflow (closes the gap where an
    # attacker who can replace a release asset could also replace the
    # plain checksum file). Mirrors the synth / witness / rivet pattern.
    # Verify with:
    #   cosign verify-blob \
    #     --certificate-identity-regexp \
    #       'https://github.com/pulseengine/sigil/.github/workflows/release.yml@.*' \
    #     --certificate-oidc-issuer \
    #       'https://token.actions.githubusercontent.com' \
    #     --bundle SHA256SUMS.txt.cosign.bundle \
    #     SHA256SUMS.txt
    - name: Sign SHA256SUMS with cosign (keyless OIDC)
      run: |
        set -euo pipefail
        cd release-assets
        cosign sign-blob \
          --yes \
          --bundle SHA256SUMS.txt.cosign.bundle \
          --output-signature SHA256SUMS.txt.sig \
          --output-certificate SHA256SUMS.txt.pem \
          SHA256SUMS.txt
        echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
        ls -la ./*

    - name: Capture build environment
      run: |
        set -euo pipefail
        {
          echo "rustc: $(rustc --version)"
          echo "cargo: $(cargo --version)"
          echo "bazel: $(cat .bazelversion)"
          echo "cosign: $(cosign version 2>&1 | head -1)"
          echo "runner: $(uname -srm)"
        } > release-assets/build-env.txt
        cat release-assets/build-env.txt

    - name: Create or update GitHub Release
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Untrusted-input safety: tag flows in via env: and is dereferenced
        # through $VERSION, never expanded into the shell.
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${INPUT_TAG}"
        elif [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        # Idempotent: re-running for an existing release uploads/overwrites
        # assets rather than failing. --clobber lets a re-run replace assets
        # a previous partial run left behind.
        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "::notice::Release $VERSION exists; uploading assets"
          gh release upload "$VERSION" --clobber release-assets/*
        else
          echo "::notice::Creating Release $VERSION with assets"
          gh release create "$VERSION" \
            --title "wsc $VERSION" \
            --generate-notes \
            release-assets/*
        fi

    - name: Create Release Summary
      run: |
        # Determine tag
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        elif [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        else
          # For push to branches, use branch name + short SHA
          TAG="${{ github.ref_name }}-${GITHUB_SHA:0:7}"
        fi

        # Sanitize tag for OCI (replace / with -)
        TAG="${TAG//\//-}"

        echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**WASM Component:**" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: \`wsc.wasm\` ($(ls -lh wsc.wasm | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact**: \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact (latest)**: \`${IMAGE_LATEST}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔐 Security" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ WASM modules signed with wsc (keyless)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ OCI artifact signed with Cosign (keyless OIDC)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SLSA provenance attestation" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SHA256 checksum provided" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
        echo "- [Download WASM](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
        echo "- [Pull OCI Artifact](${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG})" >> $GITHUB_STEP_SUMMARY
