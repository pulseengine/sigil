name: Claim Check

# Gate the repo's load-bearing public claims (README badges, compliance docs)
# against re-derivable evidence. Drift between a claim and the actual source
# fails the build. See claims.yaml + the `claim-verification` skill.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-check:
    name: Documentation claims hold
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Re-derive claims from source
        run: python3 verification/claim-check/claim-check.py claims.yaml

  # The guard runs as a WASI component (Rust, verification/selfhosted-guard),
  # built here and run under wasmtime. check.py stays only as the oracle of
  # the equivalence test: identical stdout and exit code on the 19-case
  # decision table, extra shapes, and the live workflow tree.
  selfhosted-guard:
    name: No fork PR reaches a self-hosted runner
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-selfhosted-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PyYAML (the equivalence test's oracle runs check.py)
        run: pip install --quiet pyyaml
      - name: Install wasmtime
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasmtime@50.0.1
      - name: Equivalence with check.py
        run: cargo test --locked --manifest-path verification/selfhosted-guard/Cargo.toml
      - name: Build the WASI component
        run: cargo build --locked --release --target wasm32-wasip2 --manifest-path verification/selfhosted-guard/Cargo.toml
      - name: Guard self-test and live check (component)
        run: |
          guard="$CARGO_TARGET_DIR/wasm32-wasip2/release/selfhosted-guard.wasm"
          wasmtime run --dir . "$guard" --self-test
          wasmtime run --dir . "$guard" . | tee guard.out
          python3 verification/selfhosted-guard/check.py . > check.out
          diff -u check.out guard.out
