name: Claim Check

# Gate the repo's load-bearing public claims (README badges, compliance docs)
# against re-derivable evidence. Drift between a claim and the actual source
# fails the build. See claims.yaml + the `claim-verification` skill.

on:
  # The merge queue requires "Documentation claims hold" on the merge-group
  # commit, and the Required aggregator requires it to be present there.
  merge_group:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-check:
    name: Documentation claims hold
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Re-derive claims from source
        run: python3 verification/claim-check/claim-check.py claims.yaml

  # The guard runs as a WASI component (Rust, verification/selfhosted-guard),
  # built here and run under wasmtime. check.py stays only as the oracle of
  # the equivalence test: identical stdout and exit code on the 19-case
  # decision table, extra shapes, and the live workflow tree.
  selfhosted-guard:
    name: No fork PR reaches a self-hosted runner
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-selfhosted-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PyYAML (the equivalence test's oracle runs check.py)
        run: pip install --quiet pyyaml
      - name: Install wasmtime
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasmtime@50.0.1
      - name: Equivalence with check.py
        run: cargo test --locked --manifest-path verification/selfhosted-guard/Cargo.toml
      - name: Build the WASI component
        run: cargo build --locked --release --target wasm32-wasip2 --manifest-path verification/selfhosted-guard/Cargo.toml
      - name: Guard self-test and live check (component)
        run: |
          guard="$CARGO_TARGET_DIR/wasm32-wasip2/release/selfhosted-guard.wasm"
          wasmtime run --dir . "$guard" --self-test
          wasmtime run --dir . "$guard" . | tee guard.out
          python3 verification/selfhosted-guard/check.py . > check.out
          diff -u check.out guard.out
      # The wasmtime floor (CHANGELOG, owner decision 2026-11-21): components
      # built by rustc 1.100 import wasi:cli/exit@0.2.12 exit-with-code, which
      # wasmtime < 46.0.0 refuses. The installed wasmtime above must run the
      # guard; 45.0.0 must refuse it on that import and nothing else. The
      # tarball hash is pinned here and equals GitHub's asset digest.
      - name: wasmtime floor (45.0.0 refuses, current runs the 1.100 component)
        run: |
          old_dir="$RUNNER_TEMP/wasmtime-45"
          mkdir -p "$old_dir"
          curl -fsSL -o "$old_dir/w.tar.xz" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v45.0.0/wasmtime-v45.0.0-x86_64-linux.tar.xz
          echo "9d92e6dc04630f617e0e5d532327a5a917ac4898587e07f4fb7a5fc7fffef760  $old_dir/w.tar.xz" | sha256sum -c -
          tar -xJf "$old_dir/w.tar.xz" -C "$old_dir"
          scripts/wasmtime-floor-control.sh \
            "$CARGO_TARGET_DIR/wasm32-wasip2/release/selfhosted-guard.wasm" \
            "$(command -v wasmtime)" \
            "$old_dir/wasmtime-v45.0.0-x86_64-linux/wasmtime"
      # plant (owner decision 20261118T070142-7ed73c): each control in
      # ci-controls.toml plants one bad workflow and requires the guard above
      # to reject that job by name; compared-nothing deletes the workflows.
      # plant is the released v0.2.0 binary, verified twice: cosign over
      # SHA256SUMS.txt with the exact release-workflow identity, and the
      # tarball's hash pinned here.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.2'
      - name: Install plant v0.2.0 (verified)
        env:
          PLANT_BASE: https://github.com/pulseengine/plant/releases/download/v0.2.0
          PLANT_TGZ: plant-v0.2.0-x86_64-unknown-linux-musl.tar.gz
          PLANT_SHA256: cd081585591bcf99d3dfac636332ce7339d2fd294e04bcc0b83004e18cb72bec
        run: |
          dir="$RUNNER_TEMP/plant"
          mkdir -p "$dir" && cd "$dir"
          for f in SHA256SUMS.txt SHA256SUMS.txt.cosign.bundle "$PLANT_TGZ"; do
            curl -fsSL --retry 3 -o "$f" "$PLANT_BASE/$f"
          done
          cosign verify-blob --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity 'https://github.com/pulseengine/plant/.github/workflows/release.yml@refs/tags/v0.2.0' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          grep " ./$PLANT_TGZ\$" SHA256SUMS.txt | sha256sum -c -
          echo "$PLANT_SHA256  $PLANT_TGZ" | sha256sum -c -
          tar -xzf "$PLANT_TGZ"
          echo "$dir" >> "$GITHUB_PATH"
      - name: "plant: the fork guard can fail"
        run: plant ci-controls.toml
