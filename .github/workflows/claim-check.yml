name: Claim Check

# Gate the repo's load-bearing public claims (README badges, compliance docs)
# against re-derivable evidence. Drift between a claim and the actual source
# fails the build. See claims.yaml + the `claim-verification` skill.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Without this, every push to a branch queues ANOTHER Claim Check run and all of
# them execute. Observed 2026-10-21: four pushes to one release branch left four
# queued runs of this workflow behind a saturated runner pool, three of them
# already superseded, while the release's own CI waited. rust.yml and
# formal-verification.yml have carried a concurrency group all along; this
# workflow and `required.yml` were the gaps.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claim-check:
    name: Documentation claims hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Re-derive claims from source
        run: python3 verification/claim-check/claim-check.py claims.yaml
