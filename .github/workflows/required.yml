name: Required

# The ONE status context main's branch protection requires.
#
# Audited 2026-10-21: `required_status_checks.contexts` on main was EMPTY and the
# repository had no rulesets, so every check here was advisory and six PRs merged
# over a board nothing enforced.
#
# Requiring the individual contexts is the obvious fix and a trap. rust.yml,
# formal-verification.yml and supply-chain.yml all carry `on: pull_request:
# paths:` filters, so on a PR touching none of their paths those workflows never
# run and never report — and a required context that never reports blocks the PR
# forever. In the other direction, a job skipped INSIDE a workflow reports
# `skipped`, and on GitHub a skipped required context SATISFIES the merge button.
# A paths filter is therefore a gate-disabler in both directions.
#
# So: this workflow has no paths filter, it is the only required context, and it
# judges what the other workflows actually reported. See
# verification/required-checks/required-checks.py for the rules and the
# 18-case decision table (`--self-test`).

on:
  # The merge queue: GitHub creates a merge-group commit and requires this
  # context on it, so the aggregator judges the merge_group runs too (its
  # --sha falls back to github.sha, the merge-group head).
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  # actions: read lists this commit's workflow runs, so jobs behind `needs:`
  # (no check-run yet) still count as unfinished.
  actions: read
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required checks
    # Self-hosted `gate-poller` (owner decision 2026-11-20, notice
    # 20261120T055256-0fafb1; label provided by smithy#215 on
    # the gate-poller pool). Before this the job polled on `light`, which
    # also runs the jobs it waits for (claim check, vacuous-oracle gate,
    # cargo audit, cargo vet): three PRs polling at once held all three light
    # runners and deadlocked them (runs 44659921868, 44663333155). The
    # gate-poller runners are capped at 1-2 GB RAM and one job each; this job
    # only runs gh and python, so it fits and no build may move here. Fork
    # PRs stay on hosted ubuntu-24.04: self-hosted runners never run fork
    # code.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","gate-poller"]') || 'ubuntu-24.04' }}
    # Above the script's 5 h overall cap, so the script fails with its own
    # message before the runner cancels the job.
    timeout-minutes: 320
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # The self-hosted runners ship no gh; required-checks.py needs it.
    - uses: ./.github/actions/setup-gh

    - name: Decision table self-test
      # The gate proves itself before it judges anything. If this fails, the
      # verdict below is not trustworthy and the job stops here.
      run: python3 verification/required-checks/required-checks.py --self-test

    - name: Every other check on this commit must be acceptable
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 verification/required-checks/required-checks.py \
          --repo "${GITHUB_REPOSITORY}" \
          --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
          --deadline-secs 3600 \
          --max-wait-secs 18000
