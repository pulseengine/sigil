  - id: FEAT-12
    type: feature
    title: "Embedded on-target trust chain: no_std verifier + signed kiln.resource_limits (reject-at-load)"
    status: draft
    tags: [embedded, no_std, kiln, gale, trust-chain]
    fields:
      description: "On-target (thumbv7em-none-eabi, gale/gust) offline key-based verification so kiln's loader can trust the signed kiln.resource_limits bounds for reject-at-load. Reuses kiln's existing ResourceLimitsSection (already no_std/bounded) and sigil's existing key-based Ed25519 path in wsc-verify-core; HW-crypto via the wsc:crypto hardware interface provided by gale. Tracks #187; kiln#415/AD-WCMC-001."
    links:
      - type: traces-to
        target: EXTERNALANCHOR-001

  - id: REQ-15
    type: requirement
    title: no_std wsc-verify-core staticlib for thumbv7em-none-eabi (secure-boot verify)
    status: draft
    tags: [embedded, no_std]
    fields:
      description: "Carve wsc-verify-core to #![no_std] behind a default 'std' feature so the host CLI is unaffected: feature-gate file-IO (std::fs/os::unix/env::temp_dir/Path ~30 uses); replace std::io::Read/Cursor (~18) with a slice reader; core::fmt. PRIMARY embedding is as a WASM COMPONENT compiled to Cortex-M via meld to loom to synth (DD-9), not a hand-carved thumbv7em staticlib — the direct thumbv7em build stays as a dep-viability check. Curve-agile: Ed25519 + ECDSA-P256 (signature/multi.rs,simple.rs). gale#164 constraints on the final artifact (synth output): no-alloc preferred or bounded+documented heap, panic=abort/no-unwind, plain extern C entry, pre-partition-start with no OS services. Alloc-free-verify spike pending. Enabling release for #187."
      release: v0.10.0
    links:
      - type: traces-to
        target: FEAT-12

      - type: traces-to
        target: DD-8
      - type: traces-to
        target: DD-9
  - id: REQ-16
    type: requirement
    title: Signed reject-at-load of kiln.resource_limits (bounds covered by whole-module signature)
    status: draft
    tags: [embedded, kiln, secure-boot]
    fields:
      description: "Reuse kiln's existing ResourceLimitsSection (kiln.resource_limits v1, already no_std/BoundedMap). sigil's whole-module signed hash already covers it (only the sig section is stripped). Pipeline: kiln embed_limits -> sigil signs -> target verifies. Verify+loader MUST reject if signature invalid OR section absent OR signed bounds (max_memory_usage/max_call_depth/...) exceed the provisioned RAM/stack budget. Hooks kiln's extract_resource_limits_from_binary / resource_limits_loader. Closes the 'trust an unsigned size claim' gap in #187."
      release: v0.11.0
    links:
      - type: traces-to
        target: FEAT-12

      - type: traces-to
        target: DD-8
  - id: DD-8
    type: design-decision
    title: "Embedded secure-boot verify profile: key-based Ed25519, HW-preferred with SW fallback"
    status: draft
    tags: [embedded, secure-boot, crypto]
    fields:
      description: "Embedded verify profile decision for #187 / kiln#415 (AD-WCMC-001)."
      rationale: "Secure-boot path on Pixhawk 6X-RT (i.MX RT1176 M7 thumbv7em + EdgeLock SE051 EAL6+). KEY-BASED (embedded public keys; keyless impossible offline). CURVE-AGILE - Ed25519 preferred, ECDSA-P256 universal fallback (SE051 Ed25519 is SKU-specific). HW-where-possible (SE051 secure storage + accelerated verify) / SW-fallback (ed25519-compact + p256, correctness-complete since verify uses only public keys, RNG-free). Dual anchor (SE051 / OTP flash) under one wsc:crypto hardware-verify interface. Both curves spike-validated no_std/thumbv7em 2026-07-11."
    links:
      - type: traces-to
        target: EXTERNALANCHOR-001

  - id: REQ-17
    type: requirement
    title: wsc:crypto hardware-verify interface with curve negotiation (Ed25519 / ECDSA-P256)
    status: draft
    tags: [embedded, crypto, gale, wit]
    fields:
      description: "Add a hardware-verify interface to wit/deps/wsc-crypto/crypto.wit mirroring hardware-signing: opaque key-handle, security-level (software..hardware-certified), and CURVE NEGOTIATION — Ed25519 preferred, ECDSA-P256 universal fallback (EdgeLock SE051 ships Ed25519 only on some SKUs; P256 is universal). One interface, two anchors: SE051 secure storage on the i.MX RT1176 target / OTP flash on bench MCUs. gale binds the SE051-over-i2c-thin backend (gale#164/#163); sigil no_std verify uses it or falls back to software. Both curves spike-validated no_std for thumbv7em 2026-07-11 (p256 verify is RNG-free)."
      release: v0.11.0
    links:
      - type: traces-to
        target: FEAT-12
      - type: traces-to
        target: DD-8

  - id: REQ-18
    type: requirement
    title: "Certificate-checked varint overflow rejection for the embedded verifier (ordeal, #190/#88)"
    status: draft
    tags: [embedded, verification, ordeal, soundness]
    fields:
      description: "Prove wasm_module/varint.rs overflow/bounds (bvmul/bvadd at widths 8/32/64, QF_BV) with ordeal for a cert.recheck()-able certificate, upgrading #88 from Kani-bounded to a machine-checkable proof. varint.rs is in wsc-verify-core = the on-target parser (REQ-15), so this hardens the secure-boot admission path: witness MC/DC (#169) + overflow certificate on the same code. Boundary is honest QF_BV only; Ed25519 (#145/#32) and Rekor Merkle (#137) are out of fragment. Gated on ordeal prove_valid API (ordeal#66, v0.13.0 — re-sequenced from v0.12.0 per ordeal#80, loom#70 prioritized); additive, no urgency. Certificate later becomes a gating CI check + a rivet-typed certificate artifact per ordeal#67."
    links:
      - type: traces-to
        target: FEAT-12
      - type: traces-to
        target: REQ-15

  - id: DD-9
    type: design-decision
    title: Embedded verifier delivered as a wasm component compiled to Cortex-M via meld to loom to synth (not a hand-carved no_std staticlib)
    status: draft
    tags: [embedded, wasm-component, meld, loom, synth, gale]
    fields:
      description: "Delivery-path decision for the embedded verifier (FEAT-12 / #187). meld+loom+synth to embedded already exist; mechanism differs from a Rust carve."
      rationale: "Final target is the WASM Component Model. The verifier (wsc-verify-core, already wasm-buildable per #129) is a wasm component that goes meld (compose+attest) then loom (optimize) then synth (AOT to Cortex-M native), reusing the existing pulseengine embedded path rather than a separate hand-written no_std thumbv7em Rust carve. Ties to #164 (the component must be signable). gale/gust constraints (gale#164) become the CONTRACT ON SYNTH OUTPUT: no-alloc preferred or bounded+documented heap (gust cores are no-alloc by discipline, no global allocator generally present), panic=abort/no-unwind, plain extern C ABI, runs pre-partition-start with no OS services. thumbv7em direct-build spike (2026-07) still valid as a dep-viability check; delivery is via synth. First proof: qemu/Renode gust-image end-to-end demo (sigil-signed image to on-target verify to reject-at-load)."
    links:
      - type: traces-to
        target: FEAT-12

  - id: DD-10
    type: design-decision
    title: MAX_SLICE_LEN = 256MB to hold a wasm component's embedded core-module section
    status: implemented
    tags: [parser, component, sign]
    fields:
      description: "Decision behind the #213 fix that unblocks wasm32-wasip2 component signing (#164)."
      rationale: A wasm32-wasip2 component embeds a whole core module as one section; a full CLI (wsc-cli.wasm) exceeds the old 16MB bound, so Section::deserialize rejected it with ParseError at sign time (#164). 256MB is generous headroom for any realistic component while still bounding a single host allocation; the excessive-length rejection still holds (test value exceeds 256MB). Tighter input-bounded read deferred to the embedded profile (REQ-15).

  - id: REQ-19
    type: requirement
    title: sigil signs + verifies wasm32-wasip2 components with large embedded core modules
    status: implemented
    tags: [sign, component, release]
    fields:
      description: "wsc sign/verify must round-trip on wasm32-wasip2 COMPONENTS (not just core modules), including a full CLI whose embedded core module exceeds 16MB. Oracle: sign then verify a >16MB-section component returns valid (reproduced locally + green release run build->sign->verify->publish). Unblocks the org-wide wasm-signing standard (#165) and agora#3. Implements #164."
    links:
      - type: traces-to
        target: DD-10

  - id: REQ-20
    type: requirement
    title: wsc-attestation ToolInfo carries toolchain-layer identity
    status: accepted
    description: "ToolInfo gains optional toolchain + toolchain_manifest_digest fields, populated from VARVE_LAYER / VARVE_LAYER_MANIFEST_DIGEST at each transformation hop, so an attestation records not just which tool ran but which qualified toolchain-set it came from. Satisfies varve REQ-PROV-001. Backward-compatible: fields serde-skip when absent; old attestations deserialize unchanged."
    tags: [attestation, provenance, varve]
    fields:
      release: v0.10.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-07T11:40:52Z
    release: v0.10.0

  - id: REQ-21
    type: requirement
    title: SLSA level claims match the cited spec (no phantom L4)
    status: accepted
    description: "Docs claiming 'SLSA Level 4 ACHIEVED' while citing SLSA v1.0 assert conformance to a level v1.0's Build track does not define (L0-L3 only; L4 is planned). The claim must state the highest level the cited spec defines and we actually meet (L3), with the L4 aspiration marked as not-yet-specified. Load-bearing: downstream compliance docs cite these."
    tags: [docs, claim-honesty, slsa]
    fields:
      release: v0.10.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-07T11:40:52Z
    release: v0.10.0

  - id: REQ-22
    type: requirement
    title: crates.io publish rides the v* tag so the registry never lags a release
    status: verified
    description: "Per release-artifact-pipeline Track B: the release workflow publishes wsc (and member crates) to crates.io on the v* tag. Currently the registry serves 0.9.0 while v0.9.4 is released — four versions of library fixes invisible to cargo-add consumers (varve pinned 0.9.0). Publish must be gated (dry-run + verify) so a stale registry can no longer diverge from a tagged release."
    tags: [release, crates-io, supply-chain]
    fields:
      release: v0.10.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-07T11:40:52Z
    release: v0.10.0

  - id: REQ-23
    type: requirement
    title: Real offline keyless verification (Rekor SET + Fulcio chain + ECDSA P-256)
    status: verified
    description: "AirGappedVerifier::verify_crypto is a stub: it neither verifies the Rekor SET nor anchors the cert chain to the bundle's Fulcio roots, and extract_public_key_from_cert feeds full SPKI DER to an ed25519-only path that requires 32 raw bytes — so it fails for any real Fulcio cert (which are ECDSA P-256). Implement genuine offline Sigstore keyless verification: verify the Rekor inclusion/SET, anchor the leaf cert to provisioned Fulcio roots, support ECDSA P-256 (curve-agile, per DD-8), and add an in-library SigstoreBundle::verify(&trust_bundle, artifact_digest) so there is a verify-blob --bundle equivalent that does not shell out to cosign. Fails-closed today (errors), so not a silent-accept hole, but the advertised offline-keyless path is unusable. Unblocks varve offline manifest verification."
    tags: [soundness, keyless, offline, airgapped]
    fields:
      release: v0.11.0
    provenance:
      created-by: ai-assisted
      model: claude-opus-4-8
      timestamp: 2026-08-07T17:16:23Z
    release: v0.11.0

  - id: REQ-24
    type: requirement
    title: Lightweight DSSE verify — extract dsse off the 179-crate wsc tree
    status: draft
    description: "wsc::dsse (DSSE sign/verify over arbitrary blobs — what a downstream offline verifier wants) lives only in the full wsc crate, whose default build pulls 179 crates (ring, rustls, ureq, rcgen, x509-parser, p256, webpki-roots). The dsse module's real deps are just base64, serde, serde_json, ed25519-compact. Move dsse into wsc-verify-core (21 crates) or a new wsc-dsse crate so an embedded/offline consumer (varve, the on-target verifier in #187) can verify DSSE without the registry/network stack. Complements the offline-keyless work."
    tags: [offline, dsse, embedded, dependency-hygiene]
    fields:
      release: v0.11.0
    provenance:
      created-by: ai-assisted
