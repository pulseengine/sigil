  - id: FEAT-7
    type: feature
    title: Cosign delegation with binary integrity verification
    status: in-progress
    description: >
      Safe cosign subprocess delegation for container image signing with
      binary integrity verification (AS-20), tag-to-digest resolution
      (AS-18), digest-bound signatures (AS-21), and OCI image reference
      parsing. Phase 3.1 of the STPA-Sec roadmap.
    fields:
      phase: phase-3
    links:
      - type: satisfies
        target: REQ-2

  - id: FEAT-8
    type: feature
    title: Rekor inclusion proof caching
    status: in-progress
    description: >
      TTL-based cache for verified Rekor inclusion proofs to provide
      availability resilience during transient Rekor outages. Cache is
      optimization-only and never weakens fail-closed guarantees (DD-2).
      Phase 4.1 of the STPA-Sec roadmap.
    fields:
      phase: phase-4
    links:
      - type: satisfies
        target: REQ-2

  - id: DD-6
    type: design-decision
    title: Cosign subprocess delegation over native sigstore-rs
    status: approved
    description: >
      Delegate container signing to the cosign binary rather than
      implementing OCI signing natively. Reduces attack surface from
      protobuf and registry client dependencies while leveraging
      cosign's ecosystem maturity.
    fields:
      rationale: >
        Cosign is the de facto standard for container signing with wide
        ecosystem support. Native implementation via sigstore-rs would
        add significant protobuf, OCI client, and registry dependencies
        to the security-critical codebase. Binary delegation with
        integrity verification (SHA-256 hash check) limits trust to the
        verified cosign binary.
      alternatives: >
        sigstore-rs native (full control, no subprocess, but heavy deps),
        notation (Microsoft alternative, less ecosystem adoption)
    links:
      - type: satisfies
        target: REQ-2

  - id: DD-7
    type: design-decision
    title: Verus-first formal verification with coq-of-rust pipeline
    status: approved
    description: >
      Use Verus (rules_verus + Bazel) as the primary verification tool.
      Verus specs are the source code — pre/post conditions and proofs
      live inline. For Rocq evidence, strip Verus annotations and feed
      through coq-of-rust (rules_rocq_rust). Lean4 (rules_lean) handles
      hard algebraic math (Ed25519 curve properties via Mathlib).
    fields:
      rationale: >
        Verus proofs are Rust code — they compile with the standard
        toolchain when verus macros expand away, and verify via Z3 SMT
        when built with rules_verus. This eliminates spec drift. The
        coq-of-rust pipeline reuses the same Rust source for ISO 26262
        mechanized proofs. Lean4+Mathlib provides the best tooling for
        algebraic properties (group law, cofactor clearing) that are
        hard to express in SMT.
      alternatives: >
        Separate spec files (spec drift risk), Rocq-only (no SMT
        automation), Lean-only (poor Rust integration)
    links:
      - type: satisfies
        target: REQ-9

  - id: REQ-14
    type: requirement
    title: Verus formal proofs for Merkle and DSSE
    status: in-progress
    description: >
      Merkle tree inclusion proof soundness (CV-20), anti-rollback
      invariant (CV-21), DSSE PAE injectivity and domain separation
      (CV-22) must be formally proven using Verus SMT verification
      via rules_verus and Bazel.
    fields:
