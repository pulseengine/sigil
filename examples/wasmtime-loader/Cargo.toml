[package]
name = "wasmtime-loader"
version = "0.1.0"
edition = "2021"
# At or below the repo toolchain (rust-toolchain.toml, 1.100.0 since 2026-11-21). This
# makes cargo's MSRV-aware resolver pick dependency versions that actually
# build here, so an incompatible bump fails fast with a clear MSRV message
# instead of surfacing as an opaque "requires rustc 1.96.0" build error in CI.
rust-version = "1.97"

[dependencies]
wsc = { path = "../../src/lib" }
# 50.x needs rustc 1.97 (rust-toolchain.toml pins 1.100.0) and is the line the
# fleet aligned on; it runs wasip2 components built by rustc 1.100, which
# wasmtime < 46.0.0 refuses. src/lib/Cargo.toml has the history.
# Default features OFF, like src/lib: wasmtime's default `cache` feature pulls
# zstd 0.13 / zstd-safe 7.3, which carry RUSTSEC-2026-0391 and 13 zstd-safe
# advisories. The loader never configures a compilation cache. `anyhow` keeps
# wasmtime::Error convertible into the loader's anyhow::Error.
wasmtime = { version = "50.0.3", default-features = false, features = ["anyhow", "component-model", "runtime", "cranelift", "std"] }
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"

[[bin]]
name = "loader"
path = "src/main.rs"
