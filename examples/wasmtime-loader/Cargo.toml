[package]
name = "wasmtime-loader"
version = "0.1.0"
edition = "2021"
# Pinned to the repo toolchain (rust-toolchain.toml channel = "1.96.1"). This
# makes cargo's MSRV-aware resolver pick dependency versions that actually
# build here, so an incompatible bump fails fast with a clear MSRV message
# instead of surfacing as an opaque "requires rustc 1.96.0" build error in CI.
rust-version = "1.96"

[dependencies]
wsc = { path = "../../src/lib" }
# 49.x needs rustc 1.96, which rust-toolchain.toml now pins (REQ-31 / #302 —
# the bump this comment used to defer to). 49.0.4 carries no open advisory;
# src/lib/Cargo.toml lists the five retired with it.
wasmtime = "49.0.4"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"

[[bin]]
name = "loader"
path = "src/main.rs"
